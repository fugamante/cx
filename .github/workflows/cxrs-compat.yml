name: cxrs-compat

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cxrs-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compat-check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      CXRS_ARTIFACT_DIR: .github/ci-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Workflow Action Pin Guardrail
        run: |
          cd "$GITHUB_WORKSPACE"
          ./scripts/check_action_pins.sh "$GITHUB_WORKSPACE"

      - name: Rust Toolchain Sync Guardrail
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 ./scripts/check_rust_toolchain_sync.py --repo-root "$GITHUB_WORKSPACE"

      - name: Command Surface Changelog Gate
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
          fi
          head="${{ github.sha }}"
          ./scripts/check_command_surface_docs.sh "$GITHUB_WORKSPACE" "$base" "$head"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust/cxrs

      - name: Rust check
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR"
          log="$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR/rust_check_${{ matrix.os }}.log"
          cd rust/cxrs
          {
            echo "== cargo fmt --check =="
            cargo fmt --check
            echo
            echo "== cargo check =="
            cargo check
            echo
            echo "== cargo clippy --all-targets -- -D warnings -D clippy::too_many_arguments =="
            cargo clippy --all-targets -- -D warnings -D clippy::too_many_arguments
            echo
            echo "== cargo test --tests -- --test-threads=1 =="
            cargo test --tests -- --test-threads=1
          } 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"

      - name: Rust File Line Guardrail
        run: |
          cd "$GITHUB_WORKSPACE"
          ./rust/cxrs/scripts/check_rs_max_lines.sh 600 "$GITHUB_WORKSPACE"

      - name: Function Name Length Guardrail
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 ./rust/cxrs/scripts/check_rust_naming.py --root rust/cxrs --max-fn-len 52 --max-type-len 48 --max-const-len 48
          python3 ./rust/cxrs/scripts/check_fn_name_length.py --root rust/cxrs --max-len 52
          python3 ./rust/cxrs/scripts/check_fn_name_length.py --root rust/cxrs/tests --max-len 52 --max-segments 7
          python3 ./rust/cxrs/scripts/check_test_naming.py --root rust/cxrs/tests --max-len 48 --max-segments 7

      - name: Integration Refactor Guardrails
        run: |
          cd "$GITHUB_WORKSPACE"
          ./rust/cxrs/scripts/check_integration_guardrails.sh "$GITHUB_WORKSPACE" 500

      - name: Telemetry Schema Smoke
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          git -C "$repo" init -q
          mkdir -p "$repo/.cx/cxlogs"
          cat > "$repo/.cx/cxlogs/runs.jsonl" <<'JSONL'
          {"execution_id":"e1","timestamp":"2026-01-01T00:00:00Z","command":"cx","backend_used":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":10,"schema_enforced":false,"schema_valid":true}
          {"execution_id":"e2","timestamp":"2026-01-01T00:00:01Z","command":"next","backend_used":"primary","capture_provider":"native","execution_mode":"deterministic","duration_ms":20,"schema_enforced":true,"schema_valid":true,"task_id":"task_1"}
          JSONL
          out="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- logs stats 2 --json)"
          echo "$out" | jq -e '.window_runs == 2' >/dev/null
          echo "$out" | jq -e '.fields | type == "array"' >/dev/null
          echo "$out" | jq -e '.contract_drift.new_keys_second_half | type == "array"' >/dev/null
          echo "$out" | jq -e '.retry_telemetry | type == "object"' >/dev/null
          echo "$out" | jq -e '.http_mode_stats | type == "array"' >/dev/null

      - name: Strict Log Contract Smoke
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          git -C "$repo" init -q
          mkdir -p "$repo/.cx/cxlogs"
          cat > "$repo/.cx/cxlogs/runs.jsonl" <<'JSONL'
          {"execution_id":"s1","timestamp":"2026-01-01T00:00:00Z","command":"cx","backend_used":"primary","adapter_type":"primary-cli","provider_transport":"process","provider_status":null,"http_request_profile":null,"http_provider_format":null,"http_parser_mode":null,"capture_provider":"native","execution_mode":"lean","duration_ms":10,"schema_enforced":false,"schema_valid":true,"quarantine_id":null,"task_id":null,"system_output_len_raw":null,"system_output_len_processed":null,"system_output_len_clipped":null,"system_output_lines_raw":null,"system_output_lines_processed":null,"system_output_lines_clipped":null,"input_tokens":null,"cached_input_tokens":null,"effective_input_tokens":null,"output_tokens":null,"policy_blocked":null,"policy_reason":null,"timed_out":null,"timeout_secs":null,"command_label":null,"retry_attempt":null,"retry_max":null,"retry_reason":null,"retry_backoff_ms":null}
          JSONL
          out="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- logs validate --strict)"
          echo "$out" | grep -q "status: ok"

      - name: Phase IV Scheduler Gate
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          git -C "$repo" init -q
          mkdir -p "$repo/.cx/cxlogs"
          cat > "$repo/.cx/cxlogs/runs.jsonl" <<'JSONL'
          {"execution_id":"s1","timestamp":"2026-01-01T00:00:00Z","command":"cxo","tool":"cxo","backend_used":"primary","backend_selected":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":12,"schema_enforced":false,"schema_valid":true,"queue_ms":3000,"worker_id":"w1"}
          {"execution_id":"s2","timestamp":"2026-01-01T00:00:01Z","command":"cxo","tool":"cxo","backend_used":"primary","backend_selected":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":14,"schema_enforced":false,"schema_valid":true,"queue_ms":3200,"worker_id":"w1"}
          {"execution_id":"s3","timestamp":"2026-01-01T00:00:02Z","command":"cxo","tool":"cxo","backend_used":"primary","backend_selected":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":16,"schema_enforced":false,"schema_valid":true,"queue_ms":3400,"worker_id":"w1"}
          JSONL
          set +e
          out="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- diag --json --strict --window 3)"
          rc=$?
          set -e
          test "$rc" -eq 1
          echo "$out" | jq -e '.severity != "ok"' >/dev/null
          echo "$out" | jq -e '.scheduler.queue_rows == 3' >/dev/null
          echo "$out" | jq -e '.retry.rows_with_retry_metadata == 0' >/dev/null
          sched="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- scheduler --json --window 3)"
          echo "$sched" | jq -e '.scheduler_window_requested == 3' >/dev/null
          echo "$sched" | jq -e '.retry.rows_with_retry_metadata == 0' >/dev/null

      - name: Optimize Retry Contract Gate
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          git -C "$repo" init -q
          mkdir -p "$repo/.cx/cxlogs"
          cat > "$repo/.cx/cxlogs/runs.jsonl" <<'JSONL'
          {"execution_id":"o1","timestamp":"2026-01-01T00:00:00Z","command":"cxo","tool":"cxo","backend_used":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":1000,"schema_enforced":false,"schema_valid":true,"task_id":"task_001","retry_attempt":1,"timed_out":true}
          {"execution_id":"o2","timestamp":"2026-01-01T00:00:01Z","command":"cxo","tool":"cxo","backend_used":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":800,"schema_enforced":false,"schema_valid":true,"task_id":"task_001","retry_attempt":2,"timed_out":false}
          JSONL
          out="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- optimize 10 --json)"
          echo "$out" | jq -e '.scoreboard.retry_health.rows_after_retry == 1' >/dev/null
          echo "$out" | jq -e '.scoreboard.retry_health.rows_after_retry_success == 1' >/dev/null
          echo "$out" | jq -e '.scoreboard.retry_health.attempt_histogram | type == "array"' >/dev/null

      - name: Broker Benchmark Contract Gate
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          git -C "$repo" init -q
          mkdir -p "$repo/.cx/cxlogs"
          cat > "$repo/.cx/cxlogs/runs.jsonl" <<'JSONL'
          {"execution_id":"b1","timestamp":"2026-01-01T00:00:00Z","command":"cxo","tool":"cxo","backend_used":"primary","backend_selected":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":1000,"schema_enforced":false,"schema_valid":true,"effective_input_tokens":100,"output_tokens":20}
          {"execution_id":"b2","timestamp":"2026-01-01T00:00:01Z","command":"cxo","tool":"cxo","backend_used":"ollama","backend_selected":"ollama","capture_provider":"native","execution_mode":"lean","duration_ms":1500,"schema_enforced":false,"schema_valid":true,"effective_input_tokens":90,"output_tokens":18}
          JSONL
          out="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- broker benchmark --backend primary --backend ollama --window 10 --strict --min-runs 1 --json)"
          echo "$out" | jq -e '.window == 10' >/dev/null
          echo "$out" | jq -e '.summary | type == "array"' >/dev/null
          echo "$out" | jq -e '.summary | length == 2' >/dev/null
          echo "$out" | jq -e '.summary[] | has("backend") and has("runs") and has("avg_duration_ms") and has("p95_duration_ms") and has("avg_effective_input_tokens") and has("avg_output_tokens")' >/dev/null
          echo "$out" | jq -e '.strict == true and .min_runs == 1 and .severity == "critical"' >/dev/null
          echo "$out" | jq -e '.violations | type == "array" and length == 0' >/dev/null
          echo "$out" | jq -e '.violation_counts.warn == 0 and .violation_counts.critical == 0' >/dev/null

          # Warn-only threshold path: insufficient samples but non-zero per backend should fail only under severity=warn.
          cat > "$repo/.cx/cxlogs/runs.jsonl" <<'JSONL'
          {"execution_id":"bw1","timestamp":"2026-01-01T00:00:00Z","command":"cxo","tool":"cxo","backend_used":"primary","backend_selected":"primary","capture_provider":"native","execution_mode":"lean","duration_ms":900,"schema_enforced":false,"schema_valid":true}
          {"execution_id":"bw2","timestamp":"2026-01-01T00:00:01Z","command":"cxo","tool":"cxo","backend_used":"ollama","backend_selected":"ollama","capture_provider":"native","execution_mode":"lean","duration_ms":950,"schema_enforced":false,"schema_valid":true}
          JSONL
          set +e
          warn_out="$(cd "$repo" && cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/rust/cxrs/Cargo.toml" -- broker benchmark --backend primary --backend ollama --window 10 --strict --min-runs 2 --severity warn --json)"
          warn_rc=$?
          set -e
          test "$warn_rc" -eq 1
          echo "$warn_out" | jq -e '.severity == "warn"' >/dev/null
          echo "$warn_out" | jq -e '.violation_counts.warn >= 1 and .violation_counts.critical == 0' >/dev/null

      - name: Quality gate
        run: |
          cd rust/cxrs
          # Gate on stderr hygiene only; size caps are enforced by dedicated line guardrails.
          python3 tools/quality_gate.py --max-file-lines 100000 --max-fn-lines 100000 --max-raw-eprintln 0

      - name: Release Metadata Guard Tests
        run: |
          cd rust/cxrs
          python3 -m unittest tools.test_release_check

      - name: Release Metadata Check
        run: |
          cd rust/cxrs
          python3 tools/release_check.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --max-version-age-days 14 \
            --cadence-exception-label release-exception \
            --event-name "${{ github.event_name }}" \
            --event-path "${{ github.event_path }}"

      - name: Compat check
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR"
          log="$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR/compat_check_${{ matrix.os }}.log"
          cd rust/cxrs
          ./scripts/compat_check.sh 50 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"

      - name: Shell Regression Suite
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR"
          log="$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR/shell_regression_${{ matrix.os }}.log"
          cd "$GITHUB_WORKSPACE"
          {
            for t in test/*.sh; do
              bash "$t"
            done
          } 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"

      - name: Install Dependency Security Tools
        run: |
          cd rust/cxrs
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.6
          cargo install --locked cargo-outdated --version 0.19.0

      - name: Cargo Audit Gate
        run: |
          cd rust/cxrs
          cargo audit --deny warnings

      - name: Cargo Deny Advisories Gate
        run: |
          cd rust/cxrs
          cargo deny check --config deny.toml advisories

      - name: Cargo Outdated Drift Report
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR"
          log="$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR/cargo_outdated_${{ matrix.os }}.log"
          cd rust/cxrs
          cargo outdated -R 2>&1 | tee "$log"
          exit "${PIPESTATUS[0]}"
        continue-on-error: true

      - name: Build failure summary
        if: failure()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR"
          mkdir -p "$dir"
          summary="$dir/summary_${{ matrix.os }}.txt"
          {
            echo "cxrs-compat failure summary"
            echo "os: ${{ matrix.os }}"
            echo "repo: $GITHUB_REPOSITORY"
            echo "run_id: $GITHUB_RUN_ID"
            echo "run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "sha: $GITHUB_SHA"
            echo
            echo "captured logs:"
            ls -1 "$dir"/*.log 2>/dev/null || echo "(none)"
            echo
            for f in "$dir"/*.log; do
              [[ -f "$f" ]] || continue
              echo "---- $(basename "$f") ----"
              # Include error-like lines first for quick triage.
              grep -Ei '(^error:|^thread .* panicked|panic|failed|FAIL|timed out|mismatch|assertion)' "$f" | tail -n 80 || true
              echo
              echo "last 120 lines:"
              tail -n 120 "$f" || true
              echo
            done
          } > "$summary"

      - name: Extract reliability failure report
        if: failure()
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/$CXRS_ARTIFACT_DIR"
          mkdir -p "$dir"
          src="$dir/rust_check_${{ matrix.os }}.log"
          out="$dir/reliability_${{ matrix.os }}.txt"
          {
            echo "reliability failure report"
            echo "os: ${{ matrix.os }}"
            echo "repo: $GITHUB_REPOSITORY"
            echo "run_id: $GITHUB_RUN_ID"
            echo "sha: $GITHUB_SHA"
            echo
            if [[ ! -f "$src" ]]; then
              echo "rust check log unavailable"
              exit 0
            fi
            python3 "$GITHUB_WORKSPACE/rust/cxrs/scripts/reliability_report.py" "$src"
          } > "$out"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cxrs-compat-artifacts-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ env.CXRS_ARTIFACT_DIR }}
          retention-days: 14
          if-no-files-found: ignore
