[package]
name = "cxrs"
version = "2026.8.29"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = true, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
jsonschema = "0.49.9"
fs2 = "0.4"
wait-timeout = "0.2"
shell-words = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
